name: Release

# Publishes humanauthn to PyPI with Trusted Publishing (OIDC, no secrets)
# and PEP 740 attestations. PyPI trusted publishing is repo/workflow-scoped
# (not actor-scoped), so bot-triggered tag pushes are fine.
#
# Triggers:
# - Pushing a semver tag (e.g. v0.1.0)
# - Manually via the Actions tab ("Run workflow")
#
# One-time prerequisites (do these before the first tag):
# 1. Create a PyPI account and add a pending Trusted Publisher for project
#    `humanauthn` -> repo `ZelfOfficial/humanauthn-python-sdk`,
#    workflow `release.yml`, environment `pypi`.
# 2. Create a GitHub Environment named `pypi`.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - name: Build sdist and wheel
        run: uv build
      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      attestations: write
    steps:
      - name: Download dist artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          attestations: true
